<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InputTypes</title>
</head>
<body>
    <form>
        <h1>All Input Types Example</h1>
        <label>Enter Your Name</label>
        <input type="text" placeholder="Enter Initial Name"/>
        <label>Enter Father's Name</label>
        <input type="text" placeholder="Enter Father's Name"/>
        <label>Enter Surname</label>
        <input type="text" placeholder="Enter Surname"/><br><br>
        <label>Enter Email</label>
        <input type="email" placeholder="Enter your email"/><br><br>
        <label>Phone Number</label>
        <input type="number" placeholder="Enter Your Phone Number"/><br><br>
        <label>Password</label>
        <input type="password" placeholder="Enter Your Password"/><br><br>
        <label>Enter Your BirthDate</label>
        <input type="date"/><br><br>
        <label>Month</label>
        <input type="month"/>
        <label>Week</label>
        <input type="week"/>
        <label>Time</label>
        <input type="time"/>
        <label>Enter Date&Time</label>
        <input type="datetime-local"/>
        <label>Select Range</label>
        <input type="range"/><br><br>
        <label>Choose Cities</label>
        <input type="checkbox"/>Pune
        <input type="checkbox" checked/>Kolhapur
        <input type="checkbox"/>Nashik
        <input type="checkbox"/>Mumbai <br><br>
        <label>Select Gender</label>
        <input type="radio" name="gender"/>Male
        <input type="radio" name="gender"/>Female
        <input type="radio" name="gender"/>other<br><br>
        <label>Upload Documents</label>
        <input type="file" multiple/>
        <label>Select Your Fav Color</label>
        <input type="color"/><br><br>
        <label>Select Fav Dish</label>
        <select>
            <option>Menu</option>
            <option>Chicken Chilli</option>
            <option>Biryani</option>
            <option>Manchurian</option>
            <option>Ice cream</option>
        </select><br><br>
        <label>Enter Address</label>
        <textarea rows="10" cols="40"></textarea>
        <br><br><br>
        <input type="submit" value="Submit"/>
        <input type="button" value="Button"/>
        <input type="reset" value="Reset"/>
        </form>
</body>
</html>
